<!DOCTYPE html>
<html>
    <head>
        <title>Floating Contact Widget</title>
        <style>
            body{
                margin: 0;
                padding: 20px;
                background-color: rgb(255, 111, 0);
            }

            .contact-widget{
                position: fixed;
                bottom: 20px;
                right: 20px;

                background-color: bisque;
                border: 2px solid black;
                padding: 15px;
                border-radius: 8px;
                width: 220px;

                z-index: 9999;
            }

            .contact-widget:hover{
                background-color: aquamarine;
            }

            .content-block{
                background-color: azure;
                border: 1px solid black;
                padding: 40px;
                margin-bottom: 20px;
                height: 400px;
            }
        </style>
    </head>
    <body>
        <h2>Scroll down to see the widget</h2>
        <p>Notice how the blue contact box in the corner never moves, even when the page moves</p>

        <div class="content-block"><h3>Website Content Block 1</h3></div>
        <div class="content-block"><h3>Website Content Block 2</h3></div>
        <div class="content-block"><h3>Website Content Block 3</h3></div>
        <div class="content-block"><h3>Website Content Block 4</h3></div>

        <div class="contact-widget">
            <h4>Contact Us</h4>
            <p>Phone: 01777670064</p>
            <p>Email: srleon512@gmail.com</p>
        </div>
    </body>
</html>
