<!doctype html>
<html>
    <head>
        <title>User Card</title>
        <style>
            body{
                background-color: rgb(33, 240, 240);
                padding: 50px;
                display: flex;
                justify-content: center;
            }

            .user-card{
                position: relative;
                width: 300px;

                background-color: bisque;
                border: 1px solid black;
                padding: 20px;

                border-radius: 12px;
                border-bottom: 4px solid black;

                text-align: center;
            }

            .status{
                position: absolute;
                top: 15px;
                right: 15px;

                background-color: aquamarine;
                padding: 5px 10px;
                border-radius: 20px;
            }

            .profile-pic {
                width: 90px;
                height: 90px;
                border-radius: 50%;
                object-fit: cover;
                background-color: #eeeeee;
                margin-bottom: 15px;
            }
        </style>
    </head>
    <body>
        <div class="user-card">
            <span class="status">Online</span>

            <img src="https://via.placeholder.com/90" alt="User Profile" class="profile-pic">
            <h2 class="user-name">Sayedur Rahman Leon</h2>
            <p class="user-bio">C# Desktop applications developer.</p>
        </div>
    </body>
</html>
