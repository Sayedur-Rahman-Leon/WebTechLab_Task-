<!doctype html>
<html>
    <head>
        <title>Website Navigation Bar</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }

            nav{
                background-color: aqua;
                display: block;
                width: 100%;
                padding: 10px 0px;
                text-align: center;
            }

            nav a{
                display: inline-block;
                padding: 10px 20px;
                margin: 0px 5px;
                text-decoration: none;
                color: black;
            }

            nav a:hover{
                background-color: blue;
                color: brown;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#servies">Services</a>
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
        </nav>
    </body>
</html>
