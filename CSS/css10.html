<!DOCTYPE html>
<html>
    <head>
        <title>Z-Index Stacking Test</title>
        
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
                padding: 20px;
            }

            .banner-container {
                position: relative;
                height: 400px;
                margin-top: 30px;
            }

            .box {
                position: absolute;
                width: 200px;
                height: 150px;
                padding: 20px;
                color: #ffffff;
                font-weight: bold;
                font-size: 1.2em;
                border-radius: 8px;
                border: 2px solid rgba(0,0,0,0.1);
            }

            .red-box {
                background-color: #d32f2f;
                top: 20px;
                left: 20px;
                z-index: 1;
            }

            .blue-box {
                background-color: #1976d2;
                top: 70px;
                left: 70px;
                z-index: 2;
            }

            .green-box {
                background-color: #388e3c;
                top: 120px;
                left: 120px;
                z-index: 3;
            }
        </style>
    </head>
    <body>

        <h2>Banner Stacking and Layering System</h2>
        <p>Change the z-index numbers in the CSS styles to see them swap layers instantly!</p>

        <div class="banner-container">
            <div class="box red-box">Box 1 (Red)</div>
            <div class="box blue-box">Box 2 (Blue)</div>
            <div class="box green-box">Box 3 (Green)</div>
        </div>

    </body>
</html>
